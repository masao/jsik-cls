name: LaTeX compatibility

on:
  push:
    branches:
      - main
    paths:
      - "**/*.cls"
      - "**/*.sty"
      - "**/*.tex"
      - '**/*.bst'
      - '**/*.bib'
      - ".github/workflows/latex.yml"
  pull_request:
    paths:
      - "**/*.cls"
      - "**/*.sty"
      - "**/*.tex"
      - '**/*.bst'
      - '**/*.bib'
      - ".github/workflows/latex.yml"
  workflow_dispatch:

jobs:
  compatibility:
    name: "TeX Live ${{ matrix.texlive }} / ${{ matrix.engine }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        texlive:
          - "2018"
          - "2019"
          - "2020"
          - "2021"
          - "2022"
          - "2023"
          - "2024"
          - "2025"
          - "2026"
        include:
          - engine: platex
            bibtex: pbibtex
          - engine: uplatex
            bibtex: upbibtex

    container:
      image: maxkratz/texlive:${{ matrix.texlive }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check TeX environment
        run: |
          echo "TeX Live: ${{ matrix.texlive }}"
          echo "Engine: ${{ matrix.engine }}"
          echo "BibTeX: ${{ matrix.bibtex }}"

          which platex
          which uplatex

          platex --version
          uplatex --version

          kpsewhich jarticle.cls
          kpsewhich ujarticle.cls
          kpsewhich graphicx.sty
          kpsewhich balance.sty || true

      - name: Compile sample
        run: |
          ${{ matrix.engine }} \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            sample.tex

      - name: Run BibTeX
        run: |
          ${{ matrix.bibtex }} sample
          test -s sample.bbl
          ${{ matrix.engine }} \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            sample.tex
          ${{ matrix.engine }} \
            -interaction=nonstopmode \
            -halt-on-error \
            -file-line-error \
            sample.tex
          if grep -Eq \
            "Citation .* undefined|There were undefined references" \
            sample.log; then
            echo "Undefined citations or references detected"
            exit 1
          fi

      - name: Check base-class detection
        run: |
          if [ "${{ matrix.engine }}" = "platex" ]; then
            grep -q "pLaTeX detected; loading jarticle" sample.log
          else
            grep -q "upLaTeX detected; loading ujarticle" sample.log
          fi

      - name: Generate PDF
        run: |
          dvipdfmx sample.dvi

      - name: Verify PDF
        run: |
          test -s sample.pdf
          ls -lh sample.pdf